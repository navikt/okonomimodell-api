name: Dependabot deploy verification

on:
  pull_request:
    branches:
      - main

concurrency:
  group: dependabot-deploy
  cancel-in-progress: false

jobs:
  verify-deploy:
    name: Verify dependabot deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Skip for non-dependabot PRs
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        run: echo "Not a dependabot PR, skipping deploy verification"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: github.event.pull_request.user.login == 'dependabot[bot]'

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        id: app-token
        with:
          app-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Debug token + package access
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "Token length: ${#TOKEN}"
          curl -s -o /dev/null -w "pkg_status=%{http_code}\n" \
            -H "Authorization: Bearer $TOKEN" \
            https://maven.pkg.github.com/navikt/oebs-contracts/no/nav/oebs/oebs-contracts/1.0-SNAPSHOT/maven-metadata.xml

      - name: Build and test
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          MAVEN_USERNAME: x-access-token
          MAVEN_PASSWORD: ${{ steps.app-token.outputs.token }}
        run: mvn -B verify -Pcoverage

      - name: Push Docker image to GAR
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: nais/docker-build-push@423a915c9b72edf2ba848b88171ccb0489e2a40a
        id: docker-build-push
        with:
          team: team-oebs

      - name: Deploy to dedicated dependabot workload
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: nais/deploy/actions/deploy@7ad7c2b833e1db74a80954e3ee6bb6ac060a8ae7
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/app-dependabot.yaml
          VAR: image=${{ steps.docker-build-push.outputs.image }}
