name: Dependabot deploy verification

on:
  pull_request:
    branches:
      - main

concurrency:
  group: dependabot-deploy
  cancel-in-progress: false

jobs:
  build-test:
    name: Build and test dependabot PR #${{ github.event.pull_request.number }}
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn -B verify -Pcoverage

  deploy-dependabot:
    name: Deploy dependabot PR #${{ github.event.pull_request.number }} to dedicated workload
    if: github.actor == 'dependabot[bot]'
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Push Docker image to GAR
        uses: nais/docker-build-push@0e73849f69ff260ee27597553c0a7848ca4e9795
        id: docker-build-push
        with:
          team: team-oebs

      - uses: nais/deploy/actions/deploy@027a91857992525139798892f2804b0ca21f4af6
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/app-dependabot.yaml
          VAR: image=${{ steps.docker-build-push.outputs.image }}

  cleanup-dependabot:
    name: Cleanup dedicated dependabot workload
    if: always() && github.actor == 'dependabot[bot]'
    needs:
      - build-test
      - deploy-dependabot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: nais/login@40b72a35a18ddf2ad74b632461139ab838cc2a2f # v0
        with:
          team: team-oebs

      - name: Delete dedicated dependabot workload
        run: kubectl delete application okonomimodell-api-dependabot -n team-oebs --ignore-not-found=true
