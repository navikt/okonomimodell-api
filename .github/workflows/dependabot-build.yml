name: Test Dependabot PRs

on:
  push:
    branches:
      - 'dependabot/**'
      - 'renovate/**'

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - run: mvn -B verify