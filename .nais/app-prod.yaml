apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: okonomimodell-api
  namespace: team-oebs
  labels:
    team: team-oebs
spec:
  image: {{image}}
  port: 8080

  azure:
    application:
      enabled: true
      allowAllUsers: true
      tenant: nav.no

  maskinporten:
    enabled: true
    scopes:
      exposes:
        # nav:okonomisystemer/okonomimodell/oksty.read
        - enabled: true
          product: "okonomisystemer"
          separator: "/"
          name: "okonomimodell/oksty.read"
          consumers:
            - orgno: "991913823"
            - orgno: "981953134"

  envFrom:
    - secret: okonomimodell-api
    - secret: okonomimodell-api-oracle

  observability:
    autoInstrumentation:
      enabled: true
      runtime: java

  prometheus:
    enabled: true
    path: /api/v1/actuator/prometheus

  liveness:
    path: /api/v1/actuator/health/liveness
    initialDelay: 60
    periodSeconds: 10
    failureThreshold: 3

  readiness:
    path: /api/v1/actuator/health/readiness
    initialDelay: 60
    periodSeconds: 10
    failureThreshold: 3

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

  replicas:
    min: 2
    max: 2
    cpuThresholdPercentage: 80

  ingresses:
    - https://okonomimodell-api.nav.no


